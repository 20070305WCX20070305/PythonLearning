# GitHub Actions 持续集成：每次 push / PR 自动跑测试
# 放置位置必须是仓库根目录下的 .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      # 一个 Python 版本失败时，其余版本继续跑完，方便一次性看到全部问题
      fail-fast: false
      matrix:
        # 注意：版本号必须加引号，否则 3.10 会被当成数字 3.1
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装项目与开发依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: 运行测试并输出覆盖率
        run: pytest --cov=myproject --cov-report=term-missing

      # 进阶（可选）：验证打包配置，并确保安装产物可用
      # - name: 构建分发包
      #   run: |
      #     python -m pip install build
      #     python -m build
