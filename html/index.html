<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="测测你是标准模型中的哪种粒子 —— 15道生活情景题，四维人格坐标匹配17种粒子人格。">
<title>测测你是标准模型中的哪种粒子</title>
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">⚛️</text></svg>'>
<style>
/* ============ 主题变量 ============ */
:root{
  --bg:#070b16;
  --bg2:#0c1226;
  --card:rgba(148,163,184,.055);
  --card-border:rgba(148,163,184,.16);
  --text:#e5eaf5;
  --muted:#8b94ad;
  --cyan:#22d3ee;
  --violet:#a78bfa;
  --gold:#fbbf24;
  --pink:#f472b6;
  --grad:linear-gradient(92deg,#67e8f9,#a78bfa 55%,#fbbf24);
  --radius:16px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,sans-serif;
  background:var(--bg);
  color:var(--text);
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
::selection{background:rgba(103,232,249,.25)}

/* ============ 背景画布 ============ */
#bg{position:fixed;inset:0;z-index:0;pointer-events:none}
.bg-tint{position:fixed;inset:0;z-index:0;pointer-events:none;background:
  radial-gradient(42% 38% at 26% 18%,rgba(56,189,248,.09),transparent 70%),
  radial-gradient(46% 42% at 78% 82%,rgba(168,85,247,.09),transparent 70%),
  radial-gradient(30% 26% at 64% 30%,rgba(251,191,36,.05),transparent 70%);}

/* ============ 应用容器 ============ */
#app{position:relative;z-index:1;max-width:680px;margin:0 auto;padding:18px 16px 64px;
  padding-top:calc(18px + env(safe-area-inset-top));}
.screen{display:none}
.screen.active{display:block;animation:fadeUp .5s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ============ 进度条 ============ */
#progress-wrap{position:fixed;top:0;left:0;right:0;z-index:6;
  background:rgba(7,11,22,.72);backdrop-filter:blur(10px);
  padding:10px 16px calc(8px + env(safe-area-inset-top));border-bottom:1px solid rgba(148,163,184,.1);
  opacity:0;pointer-events:none;transform:translateY(-100%);
  transition:transform .4s ease,opacity .4s ease}
body.quiz-mode #progress-wrap{opacity:1;pointer-events:auto;transform:none}
#progress-label{display:flex;justify-content:space-between;align-items:center;
  font-size:12px;color:var(--muted);letter-spacing:.06em;margin-bottom:7px}
#progress-label b{color:var(--cyan);font-weight:600}
#progress-track{height:5px;border-radius:99px;background:rgba(148,163,184,.14);overflow:hidden}
#progress-fill{height:100%;width:0%;border-radius:99px;background:var(--grad);
  box-shadow:0 0 12px rgba(103,232,249,.65);transition:width .55s cubic-bezier(.22,1,.36,1)}

/* ============ 通用卡片 / 按钮 ============ */
.card{background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius);
  backdrop-filter:blur(8px);padding:18px;margin-bottom:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;cursor:pointer;
  font-size:16px;font-weight:600;color:#06121f;padding:13px 26px;border-radius:99px;
  background:var(--grad);box-shadow:0 6px 22px rgba(103,232,249,.28);transition:transform .15s ease,box-shadow .2s ease}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(167,139,250,.4)}
.btn:active{transform:translateY(0) scale(.97)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid rgba(148,163,184,.35);
  box-shadow:none}
.btn.ghost:hover{border-color:var(--cyan);color:var(--cyan)}
.btn.small{font-size:14px;padding:9px 16px}
h1,h2,h3{line-height:1.25}

/* ============ 开始页 ============ */
.hero{text-align:center;padding:34px 6px 10px}
.hero .logo{font-size:56px;line-height:1;margin-bottom:14px;display:inline-block;
  animation:floaty 5s ease-in-out infinite;filter:drop-shadow(0 0 24px rgba(167,139,250,.5))}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-9px) rotate(4deg)}}
.hero h1{font-size:clamp(26px,6.4vw,36px);font-weight:800;letter-spacing:.02em;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;
  margin-bottom:10px}
.hero .sub{color:var(--muted);font-size:14.5px;line-height:1.8}
.start-cta{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:26px}
.hint{font-size:12px;color:#5c6680;text-align:center}

/* ============ 答题页 ============ */
#quiz-head{margin:12px 0 14px;display:flex;align-items:center;justify-content:space-between}
#qnum{font-size:13px;color:var(--muted);letter-spacing:.08em}
#qnum b{color:var(--gold);font-size:15px}
#qcard{transition:opacity .28s ease,transform .28s ease}
#qcard.out{opacity:0;transform:translateX(-34px)}
#qcard.in{animation:qIn .4s ease both}
@keyframes qIn{from{opacity:0;transform:translateX(34px)}to{opacity:1;transform:none}}
#qtext{font-size:17.5px;font-weight:600;line-height:1.6;margin-bottom:16px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;cursor:pointer;
  background:rgba(148,163,184,.05);border:1px solid rgba(148,163,184,.18);border-radius:14px;
  padding:13px 14px;margin-bottom:10px;font-size:15px;line-height:1.55;color:var(--text);
  font-family:inherit;transition:border-color .18s ease,background .18s ease,transform .12s ease;
  touch-action:manipulation;user-select:none}
.opt:hover{border-color:rgba(34,211,238,.55);background:rgba(34,211,238,.06)}
.opt:active{transform:scale(.985)}
.opt .letter{flex:none;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:13px;font-weight:700;color:#0b1424;background:rgba(148,163,184,.35);
  margin-top:1px;transition:background .18s ease,color .18s ease}
.opt.sel{border-color:var(--cyan);background:rgba(34,211,238,.1);
  box-shadow:0 0 0 1px rgba(34,211,238,.5),0 0 26px rgba(34,211,238,.22)}
.opt.sel .letter{background:var(--grad);color:#06121f}
.opt:disabled{cursor:default;opacity:.92}
.quiz-foot{display:flex;justify-content:space-between;gap:10px;margin-top:6px;
  font-size:11.5px;color:#5c6680;flex-wrap:wrap}
.next-row{display:none;justify-content:center;margin-top:16px}
.next-row.show{display:flex;animation:fadeUp .3s ease both}
#btn-next{min-width:150px}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.btn:disabled:hover{transform:none;box-shadow:none}

/* ============ 结果页 ============ */
.result-head{text-align:center;padding:26px 8px 8px}
.emoji-ring{width:104px;height:104px;margin:0 auto 16px;border-radius:50%;display:flex;
  align-items:center;justify-content:center;font-size:52px;position:relative;
  background:radial-gradient(circle at 34% 30%,rgba(103,232,249,.2),rgba(167,139,250,.12) 60%,transparent);
  border:1px solid rgba(103,232,249,.35);
  box-shadow:0 0 34px rgba(103,232,249,.35),inset 0 0 26px rgba(167,139,250,.18);
  animation:popIn .65s cubic-bezier(.2,1.4,.4,1) both}
@keyframes popIn{from{opacity:0;transform:scale(.55) rotate(-12deg)}to{opacity:1;transform:none}}
.result-head h2{font-size:clamp(30px,7vw,40px);font-weight:800;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.result-head .en{color:var(--muted);font-size:14px;letter-spacing:.18em;margin-top:6px;text-transform:uppercase}
.result-head .tagline{display:inline-block;margin-top:12px;font-size:14.5px;color:var(--gold);
  border:1px solid rgba(251,191,36,.35);background:rgba(251,191,36,.07);
  padding:6px 16px;border-radius:99px}
.result-grid{display:grid;gap:14px;margin-top:16px}
@media(min-width:760px){.result-grid{grid-template-columns:1fr 1fr}}
.card h3{font-size:15.5px;font-weight:700;margin-bottom:12px;letter-spacing:.04em;color:var(--text)}
.card h3 .dot{color:var(--cyan)}
.radar-wrap{display:flex;flex-direction:column;align-items:center;gap:10px}
.radar-wrap canvas{max-width:100%}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.swatch{width:11px;height:11px;border-radius:3px;display:inline-block}
.coords{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
.chip{background:rgba(148,163,184,.06);border:1px solid rgba(148,163,184,.14);border-radius:10px;
  padding:8px 10px;font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:6px}
.chip b{color:var(--cyan);font-weight:700}
.chip .u{color:var(--cyan)}
.chip .p{color:var(--gold)}
.dist-note{font-size:12px;color:var(--muted);text-align:center;margin-top:4px}
.dist-note b{color:var(--gold)}
.desc{font-size:14.5px;line-height:1.95;color:#c8d2e6;text-align:justify}
table{width:100%;border-collapse:collapse;font-size:13.5px}
table tr{border-bottom:1px solid rgba(148,163,184,.12)}
table tr:last-child{border-bottom:none}
table td{padding:10px 6px;vertical-align:top;line-height:1.6}
table td.phys{color:var(--cyan);width:48%;font-weight:500}
table td.pers{color:var(--gold)}
table td .tick{font-size:11px;color:#5c6680;display:block;margin-top:3px}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.copy-ok{color:#4ade80;font-size:12.5px;text-align:center;margin-top:10px;min-height:18px}

/* ============ 粒子图鉴弹窗 ============ */
#modal{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;
  padding:18px;background:rgba(4,7,15,.72);backdrop-filter:blur(12px)}
#modal.open{display:flex;animation:fadeUp .3s ease both}
#modal-panel{width:100%;max-width:560px;max-height:86vh;overflow-y:auto;background:#0c1226;
  border:1px solid rgba(148,163,184,.22);border-radius:20px;padding:20px;
  box-shadow:0 30px 80px rgba(0,0,0,.55)}
#modal-close{position:sticky;top:0;float:right;background:rgba(148,163,184,.12);border:none;color:var(--text);
  width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:15px;z-index:2}
#modal-close:hover{background:rgba(244,114,182,.25)}
.gallery{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:8px}
@media(min-width:560px){.gallery{grid-template-columns:1fr 1fr 1fr}}
.g-item{display:flex;align-items:center;gap:9px;text-align:left;cursor:pointer;
  background:rgba(148,163,184,.06);border:1px solid rgba(148,163,184,.16);border-radius:12px;
  padding:9px 11px;font-size:13.5px;color:var(--text);font-family:inherit;transition:border-color .15s}
.g-item:hover{border-color:var(--cyan)}
.g-item .e{font-size:22px}
.g-back{background:none;border:1px solid rgba(148,163,184,.3);color:var(--muted);border-radius:99px;
  padding:6px 14px;font-size:13px;cursor:pointer;margin-bottom:12px;font-family:inherit}
.g-back:hover{color:var(--cyan);border-color:var(--cyan)}
#modal-detail .result-head{padding:8px 0}
#modal-detail table{font-size:13px}
#modal-detail .desc{font-size:13.5px}

/* ============ 特效层 / Toast ============ */
#fx{position:fixed;inset:0;z-index:8;pointer-events:none}
#toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(20px);
  background:rgba(12,18,38,.92);border:1px solid rgba(34,211,238,.4);color:var(--text);
  font-size:13.5px;padding:10px 20px;border-radius:99px;z-index:30;opacity:0;transition:all .3s ease;
  pointer-events:none;box-shadow:0 8px 30px rgba(0,0,0,.4)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:420px){
  #qtext{font-size:16.5px}
  .opt{font-size:14.5px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<!-- 进度条 -->
<div id="progress-wrap">
  <div id="progress-label">
    <span id="qnum">第 <b>1</b> / 15 题</span>
    <span style="font-size:12px;color:var(--muted)">⚡ 能量正在聚集</span>
  </div>
  <div id="progress-track"><div id="progress-fill"></div></div>
</div>
<canvas id="bg"></canvas>
<div class="bg-tint"></div>

<div id="app">

  <!-- 开始页 -->
  <section class="screen active" id="screen-start">
    <div class="hero">
      <div class="logo">⚛️</div>
      <h1>测测你是标准模型中的哪种粒子</h1>
      <p class="sub">15 道生活情景题 · 17 种粒子人格，你是哪一种？</p>
    </div>
    <div class="start-cta">
      <button class="btn" id="btn-start">开始测试 →</button>
      <p class="hint">全程无物理术语 · 每题凭第一直觉作答</p>
    </div>
  </section>

  <!-- 答题页 -->
  <section class="screen" id="screen-quiz">
    <div id="quiz-head">
      <span id="qnum">第 <b>1</b> / 15 题</span>
      <span style="font-size:12px;color:var(--muted)">⚡ 能量正在聚集</span>
    </div>
    <div class="card" id="qcard">
      <div id="qtext"></div>
      <div id="opts"></div>
    </div>
    <div class="next-row" id="next-row">
      <button class="btn" id="btn-next" disabled>下一题 →</button>
    </div>

  <!-- 结果页 -->
  <section class="screen" id="screen-result">
    <div class="result-head">
      <div class="emoji-ring" id="res-emoji"></div>
      <h2 id="res-name"></h2>
      <div class="en" id="res-en"></div>
      <div class="tagline" id="res-tagline"></div>
    </div>
    <div class="result-grid">
      <div class="card">
        <h3><span class="dot">◆</span> 四维坐标雷达</h3>
        <div class="radar-wrap">
          <canvas id="radar"></canvas>
          <div class="legend">
            <span><i class="swatch" style="background:rgba(34,211,238,.85)"></i>你的坐标</span>
            <span><i class="swatch" style="background:rgba(251,191,36,.85)"></i>粒子原型</span>
          </div>
          <div class="coords" id="res-coords"></div>
        </div>
        <p class="dist-note" id="res-dist"></p>
      </div>
      <div class="card">
        <h3><span class="dot" style="color:var(--gold)">◆</span> 为什么是你</h3>
        <p class="desc" id="res-desc"></p>
      </div>
    </div>
    <div class="card">
      <h3><span class="dot" style="color:var(--pink)">◆</span> 物理属性 ↔ 人格特质</h3>
      <table id="res-table"></table>
    </div>
    <div class="actions">
      <button class="btn" id="btn-retry">🔄 再测一次</button>

      <button class="btn ghost small" id="btn-copy">📋 复制结果</button>

    <div class="copy-ok" id="copy-msg"></div>
  </section>
</div>

<canvas id="fx"></canvas>
<div id="toast"></div>

<!-- 粒子图鉴弹窗 -->
<div id="modal">
  <div id="modal-panel">
    <button id="modal-close" aria-label="关闭">✕</button>
    <div id="modal-body"></div>
  </div>
</div>

<script>
"use strict";
/* ============================================================
 *  测测你是标准模型中的哪种粒子
 *  四维人格坐标: F 排他性 / M 质量惯性 / R 社交半径 / C 手性逻辑
 *  取值 -10 ~ +10
 *  算法: 15题选项向量累加 -> 按维度最大可达值归一化到 [-10,10]
 *        -> 与17种粒子预设坐标算距离 -> 取最贴近者
 * ============================================================ */

/* ---------- 17 种粒子预设（四维坐标 / 文案 / 属性对照） ---------- */
const PARTICLES = [
{
  name:"上夸克", en:"Up Quark", emoji:"☀️",
  tagline:"原子核里的元气担当",
  coords:{F:6, M:-6, R:6, C:5},
  desc:"你是上夸克——原子核里的元气担当。你轻（质量只有 2.2 MeV，全场最轻的夸克），所以跑得快、适应强、不记仇；你带 +2/3 电荷，永远正能量满满。质子和中子里的上夸克，就像团队里那个永远乐观的气氛组：活儿不一定最重，但缺了你，大家都会觉得少了点什么。你和下夸克是「铁磁」（磁场里的铁磁，也是你俩的铁瓷），组成世间最稳定的搭档。偶尔有人嫌你「没心没肺」，但你清楚：轻，是你的天赋，不是缺陷。人生信条：与其负重前行，不如轻装上阵——反正原子核里永远有你。",
  table:[
    ["质量仅 2.2 MeV，全场最轻的夸克","轻装上阵，跑得快、适应强、不记仇"],
    ["自旋 1/2 费米子，遵循泡利不相容","有边界感但不极端，适度保持自我"],
    ["带 +2/3 电荷，参与强力与电磁力","正能量担当，和谁都能愉快协作"],
    ["与下夸克组成质子和中子","和固定搭档组队，稳定输出快乐"],
    ["寿命极长，宇宙中最不缺的夸克","平凡日常里最可靠的存在"]
  ]
},
{
  name:"下夸克", en:"Down Quark", emoji:"🪨",
  tagline:"原子核的压舱石",
  coords:{F:6, M:-3, R:6, C:-5},
  desc:"你是下夸克——原子核的「压舱石」。你比上夸克稍重（4.7 MeV），话不多，但稳。中子的长寿靠你，质子的平衡靠你：团队里那种不显山不露水、关键时刻兜底的人，就是你了。你带 −1/3 电荷，行事低调、不抢风头，却总能把局面稳住。别人焦虑时你淡定，别人冲动时你冷静，因为你知道：一个核里可以没有花活，但不能没有压舱石。物理梗：弱作用可以把上夸克变成你，也可以把你变回去——但你从不主动折腾，稳稳待着就是你的贡献。信条：慢一点没关系，稳到最后就是赢。",
  table:[
    ["质量 4.7 MeV，比上夸克稍重","踏实稳重，存在感适中不张扬"],
    ["带 −1/3 电荷","低调谦逊，从不抢风头"],
    ["中子长寿的关键","团队里兜底的人，关键时刻靠得住"],
    ["弱作用可让上下夸克互变","可塑性强，但不主动折腾"],
    ["构成原子核的基石","平凡而不可或缺"]
  ]
},
{
  name:"奇异夸克", en:"Strange Quark", emoji:"🦄",
  tagline:"粒子界公认的怪人",
  coords:{F:8, M:2, R:4, C:7},
  desc:"你是奇异夸克——粒子界公认的「怪人」。六十多年前物理学家发现你时，惊呼「Strange！」于是你就叫了奇异夸克。你确实与众不同：比上下夸克重，却迟迟不肯衰变，硬是比「同类」多活几百倍时间（通过弱作用慢慢来），物理学家只好发明「奇异数」来给你记分。你脑回路清奇，常被误解，但自成一派；你不随大流，也懒得解释，因为你知道自己的「怪」是有价值的——正是你们的慢，成就了整个奇异粒子家族。信条：看不懂我的人多了，你算老几？我的慢，是深思熟虑。",
  table:[
    ["自带「奇异数」，被发现时惊呼 Strange!","脑回路清奇，被误解是常态"],
    ["质量 95 MeV，比上下夸克都重","有点分量，想法有深度"],
    ["经弱作用缓慢衰变，寿命出奇地长","慢热、慢性子，深思熟虑"],
    ["组成奇异粒子家族","小众圈子，自成一派"]
  ]
},
{
  name:"粲夸克", en:"Charm Quark", emoji:"💎",

const DIMS = [
  {key:"F", name:"排他性"},
  {key:"M", name:"质量惯性"},
  {key:"R", name:"社交半径"},
  {key:"C", name:"手性逻辑"}
];

/* ---------- 工具 ---------- */
const $ = s => document.querySelector(s);
function setProgress(pct){
  const el = $("#progress-fill");
  if(el) el.style.width = pct + "%";
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function r1(x){ return Math.round(x*10)/10; }
function manhattan(a,b){ return DIMS.reduce((s,k)=> s + Math.abs(a[k.key]-b[k.key]), 0); }

/* 每个维度在全部 15 题中的最大可达绝对值（由数据自动算出）：
 * F:16  M:11  R:11  C:7 —— 用于把用户累加值归一化到 [-10,10] */
const MAX_DIM = (()=>{
  const m = {F:0,M:0,R:0,C:0};
  QUESTIONS.forEach(q=>{
    DIMS.forEach(d=>{
      let mx = 0;
      q.o.forEach(o=>{ mx = Math.max(mx, Math.abs(o.v[d.key])); });
      m[d.key] += mx;
    });
  });
  return m;
})();

const state = { list:[], idx:0, total:{F:0,M:0,R:0,C:0}, locked:false };

/* ---------- 屏幕切换 ---------- */
function show(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  $("#"+id).classList.add("active");
  document.body.classList.toggle("quiz-mode", id !== "screen-start");
  window.scrollTo({top:0});
}

/* ---------- 答题渲染 ---------- */
function renderQuestion(){
  const q = state.list[state.idx];
  $("#qnum").innerHTML = "第 <b>" + (state.idx+1) + "</b> / 15 题";
  $("#qtext").textContent = q.q;
  const letters = ["A","B","C","D"];
  $("#opts").innerHTML = q.o.map((o,i)=>
    `<button class="opt" data-i="${i}"><span class="letter">${letters[i]}</span><span>${o.t}</span></button>`
  ).join("");
  setProgress((state.idx/15*100).toFixed(1));
  /* 重置「下一题」按钮 */
  $("#next-row").classList.remove("show");
  $("#btn-next").disabled = true;
  $("#qcard").classList.remove("out","in");
  void $("#qcard").offsetWidth; /* 重启动画 */
  $("#qcard").classList.add("in");
  $("#qcard").querySelectorAll(".opt").forEach(b=>{
    b.addEventListener("click", ()=> choose(Number(b.dataset.i), b));
  });
}

function choose(i, btn){
  if(state.locked) return;
  state.locked = true;
  btn.classList.add("sel");
  document.querySelectorAll("#opts .opt").forEach(b=>{ if(b!==btn) b.disabled = true; });

  const v = state.list[state.idx].o[i].v;
  DIMS.forEach(d=> state.total[d.key] += v[d.key]);

  /* 能量聚集反馈 */
  const r = btn.getBoundingClientRect();
  FX.burst(r.left + r.width/2, r.top + r.height/2);
  setProgress(((state.idx+1)/15*100).toFixed(1));
  $("#qnum").innerHTML = "第 <b>" + (state.idx+1) + "</b> / 15 题";

  const last = state.idx === state.list.length - 1;
  /* 亮起「下一题」按钮，由用户手动进入下一题 */
  const nb = $("#btn-next");
  nb.textContent = last ? "查看结果 →" : "下一题 →";
  nb.disabled = false;
  $("#next-row").classList.add("show");
}

function nextQuestion(){
  if(!state.locked) return;
  const nb = $("#btn-next");
  nb.disabled = true;
  if(state.idx === state.list.length - 1){
    finish();
    return;
  }
  $("#qcard").classList.add("out");
  setTimeout(()=>{ state.idx++; state.locked = false; renderQuestion(); }, 260);
}

/* ---------- 结果计算与渲染 ---------- */
function normalize(total){
  const n = {};
  DIMS.forEach(d=> n[d.key] = total[d.key] / MAX_DIM[d.key] * 10);
  return n;
}

function pickParticle(norm){
  let best = null, bestD = Infinity;
  PARTICLES.forEach(p=>{
    const d = manhattan(norm, p.coords);
    if(d < bestD - 1e-9){ bestD = d; best = [p]; }
    else if(Math.abs(d - bestD) < 1e-9){ best.push(p); }
  });
  if(best.length > 1){
    /* 平局: 用欧氏距离二次裁决, 仍平则随机 */
    const eu = p => Math.sqrt(DIMS.reduce((s,k)=> s + (norm[k.key]-p.coords[k.key])**2, 0));
    const min = Math.min(...best.map(eu));
    const cand = best.filter(p=> Math.abs(eu(p)-min)<1e-9);
    return cand[Math.floor(Math.random()*cand.length)];
  }
  return best[0];
}

function finish(){
  const norm = normalize(state.total);
  const p = pickParticle(norm);
  lastParticle = PARTICLES.indexOf(p);
  const dist = r1(manhattan(norm, p.coords));
  show("screen-result");              /* 先显示结果页，雷达图绘制需要真实布局尺寸 */
  renderResult(p, norm, dist);
  window.scrollTo({top:0, behavior:"smooth"});
}

function renderResult(p, norm, dist){
  $("#res-emoji").textContent = p.emoji;
  $("#res-name").textContent = p.name;
  $("#res-en").textContent = p.en;
  $("#res-tagline").textContent = "「" + p.tagline + "」";
  $("#res-desc").textContent = p.desc;
  const sim = Math.round(80 - dist);
  $("#res-dist").innerHTML = "你的坐标与 <b>" + p.name + "</b> 的契合度 " + sim + " / 80（" + PARTICLES.length + " 种粒子原型中最贴近）";

  /* 四维数值对照 */
  $("#res-coords").innerHTML = DIMS.map(d=>{
    const u = r1(norm[d.key]), pv = p.coords[d.key];
    return `<div class="chip"><b>${d.key} ${d.name}</b><span>你 <i class="u">${u>0?"+":""}${u}</i> · 粒子 <i class="p">${pv>0?"+":""}${pv}</i></span></div>`;
  }).join("");

  /* 物理属性 ↔ 人格特质 */
  $("#res-table").innerHTML = p.table.map(rw=>
    `<tr><td class="phys">${rw[0]}</td><td class="pers">${rw[1]}</td></tr>`
  ).join("");

  drawRadar(norm, p.coords);
}

/* ---------- 四维雷达图 ---------- */
function drawRadar(userV, pV){
  const canvas = $("#radar");
  const wrap = canvas.parentElement || {clientWidth: 268};
  const size = Math.max(140, Math.min(268, wrap.clientWidth - 20));
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = size * dpr;
  canvas.height = size * dpr;
  canvas.style.width = size + "px";
  canvas.style.height = size + "px";
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr,0,0,dpr,0,0);

  const cx = size/2, cy = size/2, R = size/2 - 44;
  /* 轴布局: F上 M右 R下 C左 */
  const axes = [
    {key:"F", label:"F 排他性",  ang:-Math.PI/2},
    {key:"M", label:"M 质量惯性", ang:0},
    {key:"R", label:"R 社交半径", ang:Math.PI/2},
    {key:"C", label:"C 手性逻辑", ang:Math.PI}
  ];
  const pt = (v, ang)=>{ const r = R * (v+10)/20; return [cx + r*Math.cos(ang), cy + r*Math.sin(ang)]; };

  /* 网格环: -10(中心点) 0(中点虚线) +5 +10 */
  ctx.clearRect(0,0,size,size);
  [10, 5, 0].forEach(v=>{
    const r = R * (v+10)/20;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI*2);
    ctx.strokeStyle = v===0 ? "rgba(148,163,184,.4)" : "rgba(148,163,184,.13)";
    ctx.setLineDash(v===0 ? [4,4] : []);
    ctx.lineWidth = 1;
    ctx.stroke();
  });
  ctx.setLineDash([]);

  /* 轴线与标签 */
  ctx.font = "11px 'PingFang SC','Microsoft YaHei',sans-serif";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  axes.forEach(a=>{
    const [x,y] = pt(0, a.ang);
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(x,y); ctx.strokeStyle="rgba(148,163,184,.2)"; ctx.stroke();
    const [lx,ly] = pt(10, a.ang);
    const tx = cx + (R+18)*Math.cos(a.ang), ty = cy + (R+18)*Math.sin(a.ang);
    ctx.fillStyle = "rgba(226,234,245,.75)";
    ctx.fillText(a.label, tx, ty);
    ctx.fillStyle = "rgba(148,163,184,.5)";
    ctx.fillText("−10", cx, cy + 3);
    const ex = cx + (R-10)*Math.cos(a.ang), ey = cy + (R-10)*Math.sin(a.ang);
    ctx.fillText("+10", ex, ey);
  });

  /* 多边形 */
  function poly(vals, color, fill){
    ctx.beginPath();
    axes.forEach((a,i)=>{
      const [x,y] = pt(vals[a.key], a.ang);
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    });
    ctx.closePath();
    ctx.fillStyle = fill; ctx.fill();
    ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.stroke();
    axes.forEach(a=>{
      const [x,y] = pt(vals[a.key], a.ang);
      ctx.beginPath(); ctx.arc(x,y,3,0,Math.PI*2);
      ctx.fillStyle = color; ctx.fill();
    });
  }
  poly(pV, "rgba(251,191,36,.95)", "rgba(251,191,36,.10)");
  poly(userV, "rgba(34,211,238,.95)", "rgba(34,211,238,.13)");
}

/* ============================================================
 *  背景：动态粒子流线（模拟对撞机轨迹）
 * ============================================================ */
const BG = (()=>{
  const cv = $("#bg"), ctx = cv.getContext("2d");
  let W=0, H=0, parts=[], raf=null;
  const reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const HUES = [190, 265, 45];

  function resize(){
    const dpr = Math.min(window.devicePixelRatio||1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W*dpr; cv.height = H*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    const n = Math.max(26, Math.min(70, Math.round(W*H/14000)));
    parts = Array.from({length:n}, ()=>spawn(true));
  }
  function spawn(anywhere){
    const y = anywhere ? Math.random()*H : (Math.random()<.5 ? -10 : H+10);
    const dir = Math.random()<.5 ? 1 : -1;
    return {
      x: anywhere ? Math.random()*W : (dir>0? -10 : W+10),
      y, dir,
      vx: (0.25 + Math.random()*0.9) * dir,
      vy: (Math.random()-.5)*0.25,
      size: 0.8 + Math.random()*1.7,
      hue: HUES[Math.floor(Math.random()*HUES.length)],
      alpha: 0.12 + Math.random()*0.4,
      phase: Math.random()*Math.PI*2,
      wob: 0.15 + Math.random()*0.5,
      trail: []
    };
  }
  function loop(t){
    ctx.clearRect(0,0,W,H);
    /* 对撞机环 */
    ctx.save();
    ctx.strokeStyle = "rgba(148,163,184,.07)";
    ctx.lineWidth = 1;
    const rx = Math.min(W,H)*0.42, ry = rx*0.62;
    ctx.translate(W/2, H*0.42);
    ctx.rotate(-0.15);
    ctx.beginPath(); ctx.ellipse(0,0,rx,ry,0,0,Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(0,0,rx*0.86,ry*0.86,0,0,Math.PI*2);
    ctx.strokeStyle = "rgba(103,232,249,.05)"; ctx.stroke();
    ctx.restore();

    for(const p of parts){
      p.x += p.vx; p.y += p.vy + Math.sin(t*0.001 + p.phase)*p.wob*0.4;
      p.trail.push([p.x,p.y]);
      if(p.trail.length > 6) p.trail.shift();

      /* 轨迹线 */
      for(let i=1;i<p.trail.length;i++){
        const a = p.alpha * (i/p.trail.length) * 0.55;
        ctx.strokeStyle = `hsla(${p.hue},90%,72%,${a})`;
        ctx.lineWidth = p.size*0.7;
        ctx.beginPath();
        ctx.moveTo(p.trail[i-1][0], p.trail[i-1][1]);
        ctx.lineTo(p.trail[i][0], p.trail[i][1]);
        ctx.stroke();
      }
      /* 光点（双层模拟辉光，避免 shadowBlur 的性能开销） */
      ctx.fillStyle = `hsla(${p.hue},90%,80%,${p.alpha})`;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = `hsla(${p.hue},90%,85%,${p.alpha*0.35})`;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.size*2.4,0,Math.PI*2); ctx.fill();

      /* 越界重生 */
      const m = 14;
      if(p.x < -m) p.x = W+m;
      if(p.x > W+m) p.x = -m;
      if(p.y < -m || p.y > H+m) Object.assign(p, spawn(false));
    }
    raf = requestAnimationFrame(loop);
  }
  function start(){
    resize();
    window.addEventListener("resize", resize);
    document.addEventListener("visibilitychange", ()=>{
      if(document.hidden){ cancelAnimationFrame(raf); }
      else if(!reduced){ raf = requestAnimationFrame(loop); }
    });
    if(!reduced){ raf = requestAnimationFrame(loop); }
    else{ loop(0); cancelAnimationFrame(raf); }
  }
  return {start, reduced:()=>reduced};
})();

/* ============================================================
 *  能量聚集特效（选中选项时的粒子飞向进度条）
 * ============================================================ */
const FX = (()=>{
  const cv = $("#fx"), ctx = cv.getContext("2d");
  let W=0,H=0,dots=[],raf=null,t0=0;
  function resize(){
    const dpr = Math.min(window.devicePixelRatio||1,2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W*dpr; cv.height = H*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  function burst(x,y){
    resize();
    const bar = $("#progress-fill");
    if(!bar) return;
    const rect = bar.getBoundingClientRect();
    const targetY = Math.max(26, rect.top + 2);
    const targetX = W/2;
    dots = Array.from({length:18}, ()=>{
      const a = Math.random()*Math.PI*2, sp = 1.5 + Math.random()*3;
      return {
        x, y,
        vx: Math.cos(a)*sp, vy: Math.sin(a)*sp,
        tx: targetX + (Math.random()-.5)*Math.min(140,W*0.3),
        ty: targetY,
        life: 0, max: 420 + Math.random()*160,
        hue: Math.random()<.6 ? 190 : 265,
        size: 1.2 + Math.random()*1.8
      };
    });
    t0 = performance.now();
    if(!raf) raf = requestAnimationFrame(tick);
  }
  function tick(t){
    ctx.clearRect(0,0,W,H);
    const el = Math.min(1, (t-t0)/620);
    dots = dots.filter(d=> d.life < d.max);
    for(const d of dots){
      d.life += 16;
      const k = Math.min(1, d.life/240);
      /* 先散开再向进度条聚拢 */
      d.x += d.vx*(1-k) + (d.tx-d.x)*0.055;
      d.y += d.vy*(1-k) + (d.ty-d.y)*0.055;
      d.vx *= 0.94; d.vy *= 0.94;
      const a = (1 - d.life/d.max) * 0.9;
      ctx.fillStyle = `hsla(${d.hue},95%,78%,${a})`;
      ctx.beginPath(); ctx.arc(d.x,d.y,d.size,0,Math.PI*2); ctx.fill();
    }
    if(el < 1 || dots.length){ raf = requestAnimationFrame(tick); }
    else{ raf = null; ctx.clearRect(0,0,W,H); }
  }
  return {burst};
})();

/* ---------- Toast ---------- */
let toastTimer=null;
function toast(msg){
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.classList.remove("show"), 2000);
}

/* ---------- 图鉴弹窗 ---------- */
function openGallery(){
  const body = $("#modal-body");
  body.innerHTML = `<div class="gallery">${PARTICLES.map((p,i)=>
    `<button class="g-item" data-i="${i}"><span class="e">${p.emoji}</span><span>${p.name}</span></button>`
  ).join("")}</div>`;
  body.querySelectorAll(".g-item").forEach(b=>{
    b.addEventListener("click", ()=>{
      const p = PARTICLES[Number(b.dataset.i)];
      body.innerHTML = `
        <button class="g-back">← 返回列表</button>
        <div id="modal-detail">
          <div class="result-head">
            <div class="emoji-ring" style="width:76px;height:76px;font-size:38px">${p.emoji}</div>
            <h2 style="font-size:26px">${p.name}</h2>
            <div class="en">${p.en}</div>
            <div class="tagline">「${p.tagline}」</div>
          </div>
          <div class="card" style="margin-top:14px">
            <h3><span class="dot">◆</span> 预设坐标</h3>
            <div class="coords">${DIMS.map(d=>
              `<div class="chip"><b>${d.key} ${d.name}</b><span class="p">${p.coords[d.key]>0?"+":""}${p.coords[d.key]}</span></div>`
            ).join("")}</div>
          </div>
          <div class="card">
            <h3><span class="dot" style="color:var(--gold)">◆</span> 物理属性 ↔ 人格特质</h3>
            <table>${p.table.map(rw=>`<tr><td class="phys">${rw[0]}</td><td class="pers">${rw[1]}</td></tr>`).join("")}</table>
          </div>
          <div class="card">
            <h3><span class="dot" style="color:var(--pink)">◆</span> 性格解析</h3>
            <p class="desc">${p.desc}</p>
          </div>
        </div>`;
      const back = body.querySelector(".g-back");
      back.addEventListener("click", openGallery);
    });
  });
  $("#modal").classList.add("open");
  $("#modal-body").scrollTop = 0;
}

/* ---------- 复制结果 ---------- */
async function copyResult(){
  const p = PARTICLES[lastParticle];
  const text = `我的粒子人格是「${p.name} ${p.emoji}」\n${p.tagline}\n\n你也来测测：你是标准模型中的哪种粒子？`;
  try{
    await navigator.clipboard.writeText(text);
    $("#copy-msg").textContent = "✅ 已复制，快去分享吧";
  }catch(e){
    try{
      const ta = document.createElement("textarea");
      ta.value = text; document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); document.body.removeChild(ta);
      $("#copy-msg").textContent = "✅ 已复制，快去分享吧";
    }catch(e2){
      $("#copy-msg").textContent = "复制失败，可截图分享你的结果";
    }
  }
  setTimeout(()=>{ $("#copy-msg").textContent = ""; }, 2600);
}
let lastParticle = 0;

/* ---------- 事件绑定 ---------- */
$("#btn-start").addEventListener("click", ()=>{
  state.list = shuffle(QUESTIONS.slice());
  state.idx = 0;
  state.total = {F:0,M:0,R:0,C:0};
  state.locked = false;
  renderQuestion();
  show("screen-quiz");
});
$("#btn-next").addEventListener("click", nextQuestion);
$("#btn-retry").addEventListener("click", ()=> $("#btn-start").click());
$("#btn-gallery").addEventListener("click", openGallery);
$("#modal-close").addEventListener("click", ()=> $("#modal").classList.remove("open"));
$("#modal").addEventListener("click", e=>{ if(e.target === $("#modal")) $("#modal").classList.remove("open"); });
$("#btn-copy").addEventListener("click", copyResult);

/* ---------- 启动 ---------- */
BG.start();
window.addEventListener("resize", ()=> FX.resize());
